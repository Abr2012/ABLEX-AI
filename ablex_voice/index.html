<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/streamlit-component-lib@latest/dist/index.js"></script>
</head>
<body>
  <div id="ablex-voice">
    <h3>🎙️ ABLEX Live Voice</h3>
    <p id="status">Ready</p>
    <button id="start">▶ Start Conversation</button>
    <button id="stop" disabled>⏹ Stop Conversation</button>
    <p id="transcript"></p>
  </div>

  <script>
    const { Streamlit } = window.streamlitComponentLib;
    const start = document.getElementById("start");
    const stop = document.getElementById("stop");
    const status = document.getElementById("status");
    const transcript = document.getElementById("transcript");

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition;
    let active = false;

    function sendValue(value) {
      Streamlit.setComponentValue(value);
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "en-IN";
      recognition.continuous = false;

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        transcript.textContent = "You: " + text;
        sendValue(text);
      };

      recognition.onend = () => {
        if (active) {
          status.textContent = "Listening again...";
          setTimeout(() => {
            if (active) recognition.start();
          }, 500);
        }
      };

      recognition.onerror = (event) => {
        status.textContent = "Microphone: " + event.error;
      };

      start.onclick = () => {
        active = true;
        start.disabled = true;
        stop.disabled = false;
        recognition.start();
      };

      stop.onclick = () => {
        active = false;
        recognition.stop();
        start.disabled = false;
        stop.disabled = true;
        status.textContent = "Conversation stopped";
      };
    } else {
      status.textContent = "Please use Google Chrome.";
      start.disabled = true;
    }

    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(180);
  </script>
</body>
</html>
