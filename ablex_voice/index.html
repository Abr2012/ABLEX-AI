<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/streamlit-component-lib@1.4.0/dist/index.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: white;
      background: #17113a;
    }
    button {
      padding: 12px;
      margin: 5px;
      border-radius: 10px;
      border: 1px solid #765cff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h3>🎙️ ABLEX Live Voice</h3>
  <p id="status">Ready to start</p>
  <button id="start">▶ Start Conversation</button>
  <button id="stop" disabled>⏹ Stop Conversation</button>
  <p id="transcript"></p>
  <p id="reply"></p>

  <script>
    const Streamlit = window.Streamlit;
    const status = document.getElementById("status");
    const transcript = document.getElementById("transcript");
    const reply = document.getElementById("reply");
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition = null;
    let active = false;
    let waitingForAnswer = false;
    let speaking = false;
    let lastAnswerId = 0;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        status.textContent = "🎙️ Listening...";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript.trim();

        if (text) {
          waitingForAnswer = true;
          transcript.textContent = "You: " + text;
          status.textContent = "🤖 Sending to ABLEX...";
          recognition.stop();

          Streamlit.setComponentValue({
            text: text,
            event_id: Date.now()
          });
        }
      };

      recognition.onend = () => {
        if (active && !waitingForAnswer && !speaking) {
          setTimeout(() => {
            if (active && !waitingForAnswer && !speaking) {
              try {
                recognition.start();
              } catch (error) {
                status.textContent = "Preparing microphone...";
              }
            }
          }, 500);
        }
      };

      recognition.onerror = (event) => {
        status.textContent = "Microphone error: " + event.error;
      };

      startButton.onclick = () => {
        active = true;
        waitingForAnswer = false;
        startButton.disabled = true;
        stopButton.disabled = false;

        try {
          recognition.start();
        } catch (error) {
          status.textContent = "Please try starting again.";
        }
      };

      stopButton.onclick = () => {
        active = false;
        waitingForAnswer = false;
        speaking = false;
        recognition.stop();
        window.speechSynthesis.cancel();

        startButton.disabled = false;
        stopButton.disabled = true;
        status.textContent = "Conversation stopped.";
      };
    } else {
      status.textContent = "Please use Google Chrome.";
      startButton.disabled = true;
    }

    function handleRender(event) {
      const args = event.detail.args || {};
      const answer = args.answer || "";
      const answerId = args.answer_id || 0;
      const speechLanguage = args.speech_language || "en-IN";

      if (answer && answerId !== lastAnswerId) {
        lastAnswerId = answerId;
        reply.textContent = "ABLEX: " + answer;

        if (active) {
          waitingForAnswer = false;
          speaking = true;
          window.speechSynthesis.cancel();

          const utterance = new SpeechSynthesisUtterance(answer);
          utterance.lang = speechLanguage;

          utterance.onend = () => {
            speaking = false;
            if (active) {
              status.textContent = "🎙️ Listening for your next question...";
              try {
                recognition.start();
              } catch (error) {
                status.textContent = "Please restart listening.";
              }
            }
          };

          window.speechSynthesis.speak(utterance);
        }
      }
    }

    Streamlit.events.addEventListener(
      Streamlit.RENDER_EVENT,
      handleRender
    );

    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(230);
  </script>
</body>
</html>
