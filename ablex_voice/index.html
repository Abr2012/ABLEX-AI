<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/streamlit-component-lib@1.4.0/dist/index.js"></script>
</head>
<body>
  <h3>🎙️ ABLEX Live Voice</h3>
  <p id="status">Ready</p>
  <button id="start">▶ Start Conversation</button>
  <button id="stop" disabled>⏹ Stop Conversation</button>
  <p id="transcript"></p>

  <script>
    const Streamlit = window.Streamlit;
    const status = document.getElementById("status");
    const transcript = document.getElementById("transcript");
    const start = document.getElementById("start");
    const stop = document.getElementById("stop");

    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    let recognition;
    let active = false;
    let restarting = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "en-IN";
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => {
        status.textContent = "🎙️ Listening...";
        restarting = false;
      };

      recognition.onresult = (event) => {
        const result = event.results[event.results.length - 1];
        if (!result.isFinal) return;

        const text = result[0].transcript.trim();
        if (!text) return;

        transcript.textContent = "You: " + text;

        Streamlit.setComponentValue({
          text: text,
          event_id: Date.now()
        });
      };

      recognition.onend = () => {
        if (active && !restarting) {
          restarting = true;
          setTimeout(() => {
            if (active) {
              try {
                recognition.start();
              } catch (error) {
                status.textContent = "Restarting microphone...";
                restarting = false;
              }
            }
          }, 500);
        }
      };

      recognition.onerror = (event) => {
        status.textContent = "Microphone error: " + event.error;
      };

      start.onclick = () => {
        active = true;
        start.disabled = true;
        stop.disabled = false;
        recognition.start();
      };

      stop.onclick = () => {
        active = false;
        recognition.stop();
        start.disabled = false;
        stop.disabled = true;
        status.textContent = "Conversation stopped.";
      };
    } else {
      status.textContent = "Speech recognition is unavailable. Try Chrome.";
      start.disabled = true;
    }

    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(200);
  </script>
</body>
</html>
